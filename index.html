<style>
:root{--bg:#000;--cd:#000;--tx:#f0f0f0;--mu:#8f8672;--bd:#2b2b2b;--ac:#ff9f1a;--up:#00d26a;--dn:#ff433d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cd);border-bottom:2px solid var(--ac)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff}.logo span{color:var(--ac)}
.logo::after{content:"_";color:var(--ac);animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.sp{flex:1}nav{display:flex;overflow-x:auto;border-top:1px solid var(--bd)}
nav a{white-space:nowrap;padding:6px 10px;color:var(--mu);text-decoration:none;font-weight:700;font-size:11px;letter-spacing:.04em;border-right:1px solid var(--bd)}
nav a b{color:var(--ac);margin-right:4px}nav a.on{background:var(--ac);color:#000}nav a.on b{color:#000}
main{max-width:1200px;margin:0 auto;padding:8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:8px}
.cd{background:var(--cd);border:1px solid var(--bd);padding:10px;margin-bottom:8px;overflow-x:auto}.g .cd{margin:0}
h2,.ph{background:var(--ac);color:#000;padding:4px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}.ph{margin:0}
h3{margin:0 0 8px;font-size:11px;color:var(--ac);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--bd);padding-bottom:4px}
small,.mu{color:var(--mu)}
.big{display:block;font-size:22px;font-weight:800;margin:2px 0;color:var(--ac)}
.up{color:var(--up)}.dn{color:var(--dn)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--ac);font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);background:#000;color:var(--ac);font:inherit;margin:4px 0 10px;border-radius:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--ac)}
label{font-size:10px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
button,.btn{background:var(--ac);color:#000;border:0;padding:7px 12px;font:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:0}
button.s{background:#1a1a1a;color:var(--ac);border:1px solid var(--bd);padding:4px 8px}button.r{background:var(--dn);color:#000;border:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.tag{display:inline-block;padding:1px 6px;font-size:10px;font-weight:800;background:#1a1a1a;color:var(--ac);border:1px solid var(--bd)}
.auth{max-width:380px;margin:8vh auto}.tabs{display:flex;gap:6px;margin-bottom:12px}
.bar{height:8px;background:#1a1a1a;position:relative;overflow:hidden}.bar i{position:absolute;top:0;bottom:0;background:var(--up)}
.res{background:#000;border:1px solid var(--bd);padding:10px;line-height:1.8}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#000;font-weight:800;padding:10px;display:none;z-index:20;text-align:center}
.err{color:var(--dn);min-height:18px;margin-bottom:6px}
.logo img{height:24px;width:auto;display:block}.authlogo{display:block;width:78%;max-width:280px;margin:0 auto 12px}

.g2{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}.g2 .cd{margin:0;min-width:0}

function techHTML(j){const p=j.pts||[],c=p.map(x=>x.v),n=c.length;if(n<60)return '<span class="mu">Data histori belum cukup.</span>';
const s20=sma(c,20)[n-1],s50=sma(c,50)[n-1],r=rsiS(c)[n-1],last=c[n-1];
const tr=last>s50&&s20>s50?['Naik (harga di atas SMA50, SMA20 di atas SMA50)','up']:last<s50&&s20<s50?['Turun (harga di bawah SMA50, SMA20 di bawah SMA50)','dn']:['Sideways / sinyal campuran','mu'];
const rl=r>=70?'Jenuh beli, rawan koreksi':r<=30?'Jenuh jual, rawan pantul':'Netral';
const rg=j.ranges||{},rr=k=>rg[k]?fm(rg[k].low)+' – '+fm(rg[k].high):'-',pc=v=>v==null?'-':`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${fm(v)}%</span>`;
const row=(a,b)=>`<tr><td class="mu">${a}</td><td><b>${b}</b></td></tr>`;
return `<h3>Ringkasan teknikal emas</h3><table>${row('Harga terakhir','$'+fm(last))}${row('SMA 20 / SMA 50','$'+fm(s20)+' / $'+fm(s50))}${row('RSI 14',fm(r,1)+' · '+rl)}${row('Tren',`<span class="${tr[1]}">${tr[0]}</span>`)}${row('Range hari / minggu','$'+rr('day')+' · $'+rr('week'))}${row('Range bulan','$'+rr('month'))}${row('52 minggu','$'+fm(j.low_52w)+' – $'+fm(j.high_52w))}${row('YTD / 1 tahun',pc(j.return_ytd_pct)+' / '+pc(j.return_1y_pct))}</table><small class="mu">Dihitung otomatis dari data harian xaus.com. Bukan saran trading.</small>`}

const NEWS=[['fxs','FXStreet','https://www.fxstreet.com/rss/news'],['fxi','FXStreet ID','https://www.fxstreet-id.com/rss/news'],['fxa','FXStreet Analisis','https://www.fxstreet.com/rss/analysis'],['inf','Investing Forex','https://www.investing.com/rss/news_1.rss'],['inc','Investing Komoditas','https://www.investing.com/rss/news_11.rss'],['ine','Investing Ekonomi','https://www.investing.com/rss/news_14.rss']];
const NS={on:ld('tf_news_on',{fxs:1,inf:1,inc:1}),d:{},t:{},tv:0};
const strip=h=>{try{return (new DOMParser().parseFromString(h||'','text/html').body.textContent||'').replace(/\s+/g,' ').trim()}catch(e){return ''}};
const parseXML=x=>{const d=new DOMParser().parseFromString(x,'text/xml');return [...d.querySelectorAll('item')].map(i=>{const g=n=>(i.querySelector(n)||{}).textContent||'';return{title:g('title'),link:g('link'),t:Date.parse(g('pubDate')),d:g('description')}})};
async function rss(url){const e=encodeURIComponent(url);
try{const j=await jget('https://api.rss2json.com/v1/api.json?rss_url='+e);if(j.status==='ok'&&j.items&&j.items.length)return j.items.map(i=>({title:i.title,link:i.link,t:Date.parse(String(i.pubDate).replace(' ','T')+'Z'),d:i.description||''}))}catch(x){}
for(const u of ['https://api.allorigins.win/raw?url='+e,url]){try{const r=await fetch(u);if(!r.ok)continue;const a=parseXML(await r.text());if(a.length)return a}catch(x){}}
throw new Error('rss')}
async function loadNews(keys){const out=[],bad=[];await Promise.all(keys.map(async k=>{const s=NEWS.find(x=>x[0]===k);if(!s)return;if(NS.d[k]&&Date.now()-NS.t[k]<3e5){out.push(...NS.d[k]);return}
try{const a=await rss(s[2]);NS.d[k]=a.map(i=>({...i,s:s[1]}));NS.t[k]=Date.now();out.push(...NS.d[k])}catch(e){if(NS.d[k])out.push(...NS.d[k]);else bad.push(s[1])}}));
out.sort((a,b)=>(b.t||0)-(a.t||0));return{items:out,bad}}
function newsList(items,desc){return items.map(i=>{const t=i.t&&!isNaN(i.t)?hm(i.t)+' WIB · '+ago(i.t)+' · ':'',ds=desc?strip(i.d):'',ok=/^https?:/.test(i.link||'');return `<div style="padding:7px 0;border-bottom:1px solid var(--bd)"><small class="mu">${t}<span class="tag">${esc(i.s)}</span></small><br>${ok?`<a href="${esc(i.link)}" target="_blank" rel="noopener" style="color:var(--tx);text-decoration:none;font-weight:700">${esc(i.title)}</a>`:`<b>${esc(i.title)}</b>`}${ds.length>30&&!/^Read more/i.test(ds)?`<div class="mu" style="margin-top:2px">${esc(ds.slice(0,160))}${ds.length>160?'...':''}</div>`:''}</div>`}).join('')}
function nsT(k){if(k==='tv')NS.tv=NS.tv?0:1;else NS.on[k]=NS.on[k]?0:1;sv('tf_news_on',NS.on);draw()}
HOOK.news=async()=>{const keys=NEWS.map(x=>x[0]).filter(k=>NS.on[k]),t=$('#tv');if(t){if(NS.tv){if(!t.children.length)mountTV(true)}else t.innerHTML=''}
